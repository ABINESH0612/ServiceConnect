    secret: VGhpc0lzQVRlc3RTZWNyZXRGb3JDaGFuZ2VBbmRJdFVzZWQ=
    issuer: serviceconnect-auth-test
    access-token-expiration: 900000

auth-service:
  url: http://localhost:8081

services:
  user:
    url: http://localhost:8082

brevo:
  api-key: test-api-key
  api-url: http://localhost
  sender:
    name: ServiceConnect Test
    email: test@example.com
  sms-api-url: http://localhost
  sms-sender: ServiceConnectTest